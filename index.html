<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Trading - FXROD1x</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #0a0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(0, 255, 136, 0.15) 0%, transparent 70%);
            animation: backgroundPulse 6s ease-in-out infinite;
        }
        
        @keyframes backgroundPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        
        .card {
            background: linear-gradient(145deg, rgba(10, 20, 35, 0.95) 0%, rgba(15, 30, 45, 0.98) 100%);
            border-radius: 25px;
            padding: 50px;
            max-width: 550px;
            width: 100%;
            box-shadow: 
                0 0 80px rgba(0, 255, 136, 0.4),
                0 0 40px rgba(0, 255, 136, 0.3),
                inset 0 0 60px rgba(0, 255, 136, 0.05);
            border: 3px solid rgba(0, 255, 136, 0.6);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 30%, rgba(0, 255, 136, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(0, 255, 200, 0.2) 0%, transparent 50%);
            animation: rotate 10s linear infinite;
        }
        
        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(0, 255, 136, 0.1) 50%, transparent 70%);
            animation: shimmer 3s ease-in-out infinite;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes shimmer {
            0%, 100% { opacity: 0; transform: translateX(-100%); }
            50% { opacity: 1; transform: translateX(100%); }
        }
        
        .content {
            position: relative;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .logo {
            font-size: 56px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.8));
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        
        h1 {
            color: #00ff88;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 
                0 0 30px rgba(0, 255, 136, 1),
                0 0 60px rgba(0, 255, 136, 0.7),
                0 0 90px rgba(0, 255, 136, 0.5);
            margin-bottom: 15px;
            animation: glow 2s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { 
                text-shadow: 
                    0 0 30px rgba(0, 255, 136, 1),
                    0 0 60px rgba(0, 255, 136, 0.7),
                    0 0 90px rgba(0, 255, 136, 0.5);
            }
            50% { 
                text-shadow: 
                    0 0 40px rgba(0, 255, 136, 1),
                    0 0 80px rgba(0, 255, 136, 0.9),
                    0 0 120px rgba(0, 255, 136, 0.7);
            }
        }
        
        .subtitle {
            color: #00ffc8;
            font-size: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 255, 200, 0.8);
        }
        
        .divider {
            height: 3px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(0, 255, 136, 0.3), 
                rgba(0, 255, 136, 1), 
                rgba(0, 255, 136, 0.3), 
                transparent);
            margin: 35px 0;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.7);
            animation: dividerGlow 2s ease-in-out infinite;
        }
        
        @keyframes dividerGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.7); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 136, 1); }
        }
        
        .info {
            color: #e8f5e9;
            text-align: center;
            line-height: 2;
            font-size: 17px;
        }
        
        .info p {
            margin-bottom: 18px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            transition: all 0.3s ease;
        }
        
        .info p:hover {
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
            transform: scale(1.05);
        }
        
        .highlight {
            color: #00ff88;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.9);
        }
        
        .trading-icons {
            display: flex;
            justify-content: space-around;
            margin-top: 35px;
            font-size: 36px;
        }
        
        .icon {
            filter: drop-shadow(0 0 15px rgba(0, 255, 136, 0.8));
            animation: iconFloat 2s ease-in-out infinite;
            transition: all 0.3s ease;
        }
        
        .icon:hover {
            transform: scale(1.3) rotate(10deg);
            filter: drop-shadow(0 0 30px rgba(0, 255, 136, 1));
        }
        
        .icon:nth-child(2) {
            animation-delay: 0.3s;
        }
        
        .icon:nth-child(3) {
            animation-delay: 0.6s;
        }
        
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.1); }
        }
        
        .footer {
            text-align: center;
            margin-top: 35px;
            color: #00ff88;
            font-size: 15px;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
            letter-spacing: 1px;
        }
        
        .chart-line {
            color: #00ff88;
            font-size: 28px;
            text-align: center;
            margin: 25px 0;
            text-shadow: 0 0 25px rgba(0, 255, 136, 0.9);
            letter-spacing: 5px;
            animation: chartPulse 1.5s ease-in-out infinite;
        }
        
        @keyframes chartPulse {
            0%, 100% { 
                transform: scale(1);
                text-shadow: 0 0 25px rgba(0, 255, 136, 0.9);
            }
            50% { 
                transform: scale(1.05);
                text-shadow: 0 0 40px rgba(0, 255, 136, 1);
            }
        }
        
        .neon-box {
            border: 2px solid rgba(0, 255, 136, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin: 25px 0;
            background: rgba(0, 255, 136, 0.03);
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.3),
                inset 0 0 20px rgba(0, 255, 136, 0.1);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="content">
            <div class="header">
                <div class="logo">📈</div>
                <h1>FXROD1x</h1>
                <p class="subtitle">Professional Trader</p>
            </div>
            
            <div class="divider"></div>
            
            <div class="neon-box">
                <div class="info">
                    <p>🎯 <span class="highlight">Especialista em Trading Algorítmico</span></p>
                    <p>💹 Expert Advisors | MetaTrader 5</p>
                    <p>⚡ Scalping | Supply & Demand Zones</p>
                    <p>🏆 Automação Profissional de Estratégias</p>
                </div>
            </div>
            
            <div class="chart-line">
                ╱╲╱╲╱╲╱╲
            </div>
            
            <div class="trading-icons">
                <span class="icon">💰</span>
                <span class="icon">📊</span>
                <span class="icon">🚀</span>
            </div>
            
            <div class="footer">
                <p>Trading com Precisão e Tecnologia</p>
            </div>
        </div>
    </div>
</body>
</html>
